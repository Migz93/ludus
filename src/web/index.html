<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-logo"/></svg></span>
      <span class="brand-text">
        <strong>Ludus</strong>
        <small>Living-room console</small>
      </span>
    </div>
    <nav class="nav" aria-label="Sections">
      <a class="nav-item" href="#/dashboard" data-route="dashboard"><svg class="icon" aria-hidden="true"><use href="#i-dashboard"/></svg><span>Dashboard</span></a>
      <a class="nav-item" href="#/players" data-route="players"><svg class="icon" aria-hidden="true"><use href="#i-players"/></svg><span>Players</span></a>
      <a class="nav-item" href="#/libraries" data-route="libraries"><svg class="icon" aria-hidden="true"><use href="#i-libraries"/></svg><span>Libraries</span></a>
      <a class="nav-item" href="#/disks" data-route="disks"><svg class="icon" aria-hidden="true"><use href="#i-disks"/></svg><span>Disk tools</span></a>
      <a class="nav-item" href="#/health" data-route="health"><svg class="icon" aria-hidden="true"><use href="#i-health"/></svg><span>Health</span></a>
      <a class="nav-item" href="#/mqtt" data-route="mqtt"><svg class="icon" aria-hidden="true"><use href="#i-network"/></svg><span>MQTT</span></a>
      <a class="nav-item" href="#/settings" data-route="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></a>
    </nav>
    <div class="sidebar-foot">
      <span class="dot" id="sidebar-dot" aria-hidden="true"></span>
      <span id="sidebar-state">Checking…</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-subtitle">An overview of this Ludus machine.</p>
      </div>
      <div class="topbar-actions">
        <span class="checked" id="checked-at"></span>
        <button type="button" class="btn btn-ghost" id="refresh">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
          <span>Refresh</span>
        </button>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <div class="modal-form">
    <header class="modal-head">
      <span class="modal-icon" id="modal-icon"></span>
      <h2 id="modal-title"></h2>
      <button type="button" class="icon-btn" id="modal-close" aria-label="Close">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot">
      <button type="button" class="btn btn-quiet" id="modal-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="modal-confirm">Confirm</button>
    </footer>
  </div>
</dialog>

<script nonce="{{NONCE}}">{{JS}}</script>
</body>
</html>
